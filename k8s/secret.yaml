# Callback Bearer token shared by the frontend and every compute Job.
# The worker authenticates its POST /api/jobs/<uuid>/{start,result,error}
# callbacks with `Authorization: Bearer <token>`; see SERVICE_SPLIT.md
# ("API Contract & Job States").
#
# The value below is a PLACEHOLDER — do not apply it as-is. Generate a real
# token and either patch this file locally before applying (without
# committing the real value) or create the Secret out-of-band instead of
# applying this file:
#   kubectl create secret generic lambda-xtb-callback \
#     --from-literal=token=$(openssl rand -hex 32) -n krupicka-ns
apiVersion: v1
kind: Secret
metadata:
  name: lambda-xtb-callback
type: Opaque
stringData:
  token: "REPLACE_WITH_RANDOM_TOKEN"

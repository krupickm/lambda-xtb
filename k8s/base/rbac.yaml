apiVersion: v1
kind: ServiceAccount
metadata:
  name: lambda-xtb-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lambda-xtb-job-manager
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lambda-xtb-job-manager-binding
subjects:
  - kind: ServiceAccount
    name: lambda-xtb-sa
roleRef:
  kind: Role
  name: lambda-xtb-job-manager
  apiGroup: rbac.authorization.k8s.io

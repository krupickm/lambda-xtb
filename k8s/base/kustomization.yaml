apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Instance-independent manifests. Never applied directly — always through an
# overlay (`kubectl apply -k k8s/overlays/{prod,test}`), so that every name and
# every cross-reference is rewritten consistently for the instance being
# deployed. See SERVICE_SPLIT.md ("Instances").
resources:
  - pvc.yaml
  - rbac.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml

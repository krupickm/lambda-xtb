apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lambda-xtb-ingress
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # e-infra SSO (BETA, see docs.cerit.io/en/docs/kubernetes/security): requires
    # a valid e-infra AAI login before nginx proxies the request. Both auth-url
    # and auth-signin are checked against the same character allowlist
    # (URLWithNginxVariableRegex, kubernetes/ingress-nginx
    # internal/ingress/annotations/parser/validators.go) that excludes "@" and
    # "%" entirely:
    #  - auth-url: CERIT's docs example (allowed_emails=user@domain) cannot
    #    pass it, so use oauth2-proxy's allowed_email_domains instead
    #    (oauthproxy.go) — allowed_groups / allowed_email_domains /
    #    allowed_emails are three independent, ANDed, opt-in constraints. Add
    #    more comma-separated academic domains as collaborators need access.
    #  - auth-signin: CERIT's docs example hand-encodes the redirect target as
    #    "...?rd=$scheme%3A%2F%2F$host...", which also fails the regex — this
    #    isn't caught at apply time (this annotation isn't covered by the
    #    admission webhook here), but the controller's own reconcile-time
    #    parser rejects it the same way, silently disabling the redirect (nginx
    #    then serves its own bare 401 instead of bouncing to login). Omitting
    #    the query string entirely avoids the problem: ingress-nginx's
    #    buildAuthSignURL() appends "?rd=<escaped-uri>" itself at config-render
    #    time using nginx variables, never touching the annotation string.
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth?allowed_email_domains=vscht.cz"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start"
    nginx.ingress.kubernetes.io/auth-signin-redirect-param: "rd"
    # Forwards the authenticated identity to the app, IF the shared
    # oauth2-proxy is configured to set it (its --set-xauthrequest flag,
    # oauth2-proxy/oauthproxy.go) - not something this repo controls. Harmless
    # no-op otherwise: app.py falls back to leaving the field blank. See
    # index()'s use of X-Auth-Request-Email in app.py.
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "lambda-xtb.dyn.cloud.e-infra.cz"
      secretName: lambda-xtb-dyn-cloud-e-infra-cz-tls
  rules:
    - host: "lambda-xtb.dyn.cloud.e-infra.cz"
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: lambda-xtb-svc
                port:
                  number: 80

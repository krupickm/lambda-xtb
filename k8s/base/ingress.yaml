apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lambda-xtb-ingress
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # e-infra SSO (BETA, see docs.cerit.io/en/docs/kubernetes/security): requires
    # a valid e-infra AAI login before nginx proxies the request. Omitting
    # allowed_emails to admit any authenticated e-infra identity was tried and
    # got a hard 401 from oauth2-proxy — this deployment's shared proxy
    # requires the query param, so pin it to an explicit allowlist instead.
    # Add teammates' e-infra emails here as needed.
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth?allowed_emails=krupickm@vscht.cz"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$scheme%3A%2F%2F$host$escaped_request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "lambda-xtb.dyn.cloud.e-infra.cz"
      secretName: lambda-xtb-dyn-cloud-e-infra-cz-tls
  rules:
    - host: "lambda-xtb.dyn.cloud.e-infra.cz"
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: lambda-xtb-svc
                port:
                  number: 80

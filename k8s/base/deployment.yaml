apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-xtb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lambda-xtb
  template:
    metadata:
      labels:
        app: lambda-xtb
    spec:
      serviceAccountName: lambda-xtb-sa
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lambda-xtb
          image: cerit.io/krupickm/lambda-xtb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              value: "sqlite:///data/lambda.db"
            - name: OMP_NUM_THREADS
              value: "4"
            - name: XDG_DATA_HOME
              value: "/tmp"
            - name: NAMESPACE
              value: "krupicka-ns"
            - name: COMPUTE_IMAGE
              value: "cerit.io/krupickm/lambda-xtb:latest"
            - name: CALLBACK_BASE_URL
              value: "http://lambda-xtb-svc.krupicka-ns.svc.cluster.local"
            - name: CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lambda-xtb-callback
                  key: token
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lambda-xtb-data

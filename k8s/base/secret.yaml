# Callback Bearer token shared by the frontend and every compute Job.
# The worker authenticates its POST /api/jobs/<uuid>/{start,result,error}
# callbacks with `Authorization: Bearer <token>`; see SERVICE_SPLIT.md
# ("API Contract & Job States").
#
# This declares the Secret's *name only* — deliberately no `data`/`stringData`.
# The token itself is never committed; create it out-of-band, once per
# instance, before applying that instance's overlay:
#
#   kubectl create secret generic lambda-xtb-callback \
#     --from-literal=token=$(openssl rand -hex 32) -n krupicka-ns
#   kubectl create secret generic lambda-xtb-callback-test \
#     --from-literal=token=$(openssl rand -hex 32) -n krupicka-ns
#
# Keeping it in the kustomize base (rather than out of it entirely) is what
# lets kustomize rewrite the Deployment's `secretKeyRef.name` to the suffixed
# name in the test overlay. Carrying no value is what makes `kubectl apply -k`
# safe: apply never removes a live key that the applied config never claimed,
# so re-applying an overlay leaves an existing token untouched.
apiVersion: v1
kind: Secret
metadata:
  name: lambda-xtb-callback
type: Opaque

name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Cerit Harbor
        uses: docker/login-action@v3
        with:
          registry: cerit.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cerit.io/krupickm/lambda-xtb:latest
            cerit.io/krupickm/lambda-xtb:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ github.run_number }}

      - name: Rollout restart on Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "KUBECONFIG_DATA secret not set — skipping rollout restart"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl set image deployment/lambda-xtb \
            lambda-xtb=cerit.io/krupickm/lambda-xtb:${{ github.sha }} \
            -n krupicka-ns
          kubectl set env deployment/lambda-xtb \
            COMPUTE_IMAGE=cerit.io/krupickm/lambda-xtb:${{ github.sha }} \
            -n krupicka-ns
          kubectl rollout status deployment/lambda-xtb -n krupicka-ns --timeout=300s
